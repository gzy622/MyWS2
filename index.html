<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#f2f2f4" />
    <title>教师工作台 · UI/UX Demo</title>
    <link rel="stylesheet" href="./styles/main.css" />
  </head>
  <body>
    <main class="app" id="app" aria-label="教师工作台">
      <header class="topbar" aria-label="应用顶栏">
        <button class="topbar-action topbar-menu" id="menuButton" aria-label="打开菜单">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 6.5h16M4 12h16M4 17.5h16" />
          </svg>
          <span>菜单</span>
        </button>
        <button class="topbar-title" id="topbarTitle" type="button">
          <span class="topbar-title-core">
            <span class="topbar-title-label" id="topbarTitleLabel">登记</span>
            <svg class="topbar-title-caret" viewBox="0 0 12 12" aria-hidden="true">
              <path d="M2.5 4.5 6 8l3.5-3.5" />
            </svg>
          </span>
        </button>
        <button class="topbar-action topbar-more" id="moreButton" aria-label="更多功能" aria-controls="moreMenu" aria-expanded="false" aria-haspopup="menu">
          <span>更多</span>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="7" r="2.2" /><circle cx="12" cy="17" r="2.2" />
          </svg>
        </button>
      </header>

      <div class="font-size-popover" id="fontSizePopover" role="group" aria-label="学生姓名字号" aria-hidden="true">
        <div class="font-size-popover-head">
          <label for="studentFontSize">姓名字号</label>
          <output id="studentFontSizeValue" for="studentFontSize">16px</output>
        </div>
        <input id="studentFontSize" type="range" min="14" max="18" step="1" value="16" />
        <div class="font-size-popover-scale" aria-hidden="true"><span>小</span><span>大</span></div>
      </div>

      <div class="viewport" id="viewport">
        <div class="pages" id="pages">
          <section class="page" data-page="0" aria-label="人员">
            <div class="page-inner">
              <div class="segments" role="tablist" aria-label="人员分类">
                <div class="segment-glider" aria-hidden="true"></div>
                <button class="segment active" data-sub="0">班干</button>
                <button class="segment" data-sub="1">值日</button>
              </div>
              <div class="subview active" data-view="0">
                <div class="section-title">班干名单 <span>未接入</span></div>
                <div class="card role-list" role="list" aria-label="班干职位">
                  <div class="row" role="listitem"><div class="grow"><div class="item-title">班长</div></div><span class="item-status">未指定</span></div>
                  <div class="row" role="listitem"><div class="grow"><div class="item-title">学习委员</div></div><span class="item-status">未指定</span></div>
                  <div class="row" role="listitem"><div class="grow"><div class="item-title">纪律委员</div></div><span class="item-status">未指定</span></div>
                  <div class="row" role="listitem"><div class="grow"><div class="item-title">体育委员</div></div><span class="item-status">未指定</span></div>
                </div>
              </div>
              <div class="subview" data-view="1">
                <div class="section-title">本周值日 <span>未接入</span></div>
                <div class="card duty-list" role="list" aria-label="值日轮换">
                  <div class="row" role="listitem"><div class="grow"><div class="item-title">周一</div><div class="item-note">扫地 · 擦黑板</div></div><span class="item-status">未排</span></div>
                  <div class="row" role="listitem"><div class="grow"><div class="item-title">周三</div><div class="item-note">扫地 · 倒垃圾</div></div><span class="item-status">未排</span></div>
                  <div class="row" role="listitem"><div class="grow"><div class="item-title">周五</div><div class="item-note">大扫除</div></div><span class="item-status">未排</span></div>
                </div>
              </div>
            </div>
          </section>

          <section class="page" data-page="1" aria-label="登记">
            <div class="page-inner">
              <div class="subview active" data-view="0">
                <div class="student-grid" id="studentGrid" role="list" aria-label="学生名单"></div>
              </div>
              <div class="subview seat-subview" data-view="1">
                <section class="seat-view" aria-label="座位表">
                  <div class="seat-viewport" id="seatViewport">
                    <div class="seat-stage is-view-mode" id="seatStage">
                      <div class="seat-grid" id="seatGrid" role="list" aria-label="学生座位"></div>
                      <div class="podium">讲台</div>
                    </div>
                    <p class="seat-hint" id="seatHint">查看模式 · 轻点登记 · 长按打分 · 拖动画布 · 双指缩放</p>
                  </div>
                </section>
              </div>
            </div>
          </section>

          <section class="page" data-page="2" aria-label="课程">
            <div class="page-inner">
              <div class="segments" role="tablist" aria-label="课程分类">
                <div class="segment-glider" aria-hidden="true"></div>
                <button class="segment active" data-sub="0">课表</button>
                <button class="segment" data-sub="1">成绩</button>
              </div>
              <div class="subview active" data-view="0">
                <div class="section-title">本周课表 <span>未接入</span></div>
                <div class="card week-strip" aria-label="一周课表占位">
                  <div class="week-days" aria-hidden="true">
                    <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
                  </div>
                  <div class="week-slots" aria-hidden="true">
                    <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
                  </div>
                  <p class="empty-note">课表与节次安排接入后显示在这里。</p>
                </div>
              </div>
              <div class="subview" data-view="1">
                <div class="section-title">成绩一览 <span>未接入</span></div>
                <div class="card grade-table" role="table" aria-label="成绩占位">
                  <div class="grade-head" role="row">
                    <span role="columnheader">姓名</span>
                    <span role="columnheader">分数</span>
                  </div>
                  <div class="grade-row" role="row"><span role="cell">—</span><span role="cell">—</span></div>
                  <div class="grade-row" role="row"><span role="cell">—</span><span role="cell">—</span></div>
                  <div class="grade-row" role="row"><span role="cell">—</span><span role="cell">—</span></div>
                  <p class="empty-note">成绩录入与查询接入后显示在这里。</p>
                </div>
              </div>
            </div>
          </section>
        </div>
      </div>

      <div class="bottom-shell">
        <nav class="nav" id="nav" aria-label="主导航">
          <div class="nav-glider" id="glider"></div>
          <button class="nav-btn" data-index="0" aria-label="人员">
            <span class="nav-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="9" cy="8" r="3" />
                <circle cx="17" cy="9" r="2.4" />
                <path d="M3.5 20v-1.5A5.5 5.5 0 0 1 9 13h0a5.5 5.5 0 0 1 5.5 5.5V20M14.5 14.5a4.5 4.5 0 0 1 6 4.25V20" />
              </svg>
            </span>
            <span class="subdots"><i class="on"></i><i></i></span>
          </button>
          <button class="nav-btn active" data-index="1" aria-label="登记" aria-current="page">
            <span class="nav-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M7 4h10v16H7zM9 8h6M9 12h6M9 16h4" />
                <path d="m4 12 1.5 1.5L8 11" />
              </svg>
            </span>
            <span class="subdots"><i class="on"></i><i></i></span>
          </button>
          <button class="nav-btn" data-index="2" aria-label="课程">
            <span class="nav-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 5.5A3.5 3.5 0 0 1 7.5 4H11v16H7.5A3.5 3.5 0 0 0 4 21.5z" />
                <path d="M20 5.5A3.5 3.5 0 0 0 16.5 4H13v16h3.5a3.5 3.5 0 0 1 3.5 1.5z" />
              </svg>
            </span>
            <span class="subdots"><i class="on"></i><i></i></span>
          </button>
        </nav>
      </div>

      <section class="student-record-sheet" id="studentRecordSheet" role="dialog" aria-modal="true" aria-labelledby="studentRecordTitle" aria-hidden="true" inert>
        <div class="student-record-panel sheet-panel sheet-panel--bottom" id="studentRecordPanel">
          <div class="student-record-handle-zone" id="studentRecordHandle" aria-hidden="true"><div class="sheet-handle"></div></div>
          <div class="student-record-head sheet-head">
            <div class="sheet-title"><span>学生记录</span><h2 id="studentRecordTitle">学生记录</h2></div>
            <button class="sheet-close" id="closeStudentRecord" aria-label="关闭学生记录">×</button>
          </div>
          <p class="student-record-status" id="studentRecordStatus"></p>
          <div class="student-score-display">
            <label for="studentScoreInput">本次得分</label>
            <div><input id="studentScoreInput" inputmode="none" autocomplete="off" readonly aria-describedby="studentScoreError" /><span>/ 100</span></div>
          </div>
          <div class="student-score-keypad" id="studentScoreControls" role="group" aria-label="数字键盘">
            <button type="button" data-score-key="1">1</button><button type="button" data-score-key="2">2</button><button type="button" data-score-key="3">3</button>
            <button type="button" data-score-key="4">4</button><button type="button" data-score-key="5">5</button><button type="button" data-score-key="6">6</button>
            <button type="button" data-score-key="7">7</button><button type="button" data-score-key="8">8</button><button type="button" data-score-key="9">9</button>
            <button type="button" data-score-key=".">.</button><button type="button" data-score-key="0">0</button><button type="button" data-score-key="backspace" aria-label="退格"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 6H9l-6 6 6 6h12zM11 9l6 6m0-6-6 6" /></svg></button>
          </div>
          <p id="studentScoreError" role="alert"></p>
          <div class="student-record-actions"><button type="button" id="clearStudentRecord">清除记录</button><button type="button" id="saveStudentRecord">保存</button></div>
        </div>
      </section>
      <section class="more-menu" id="moreMenu" role="menu" aria-label="更多" aria-hidden="true" inert>
        <div class="more-menu-panel">
          <div class="more-actions">
            <button type="button" role="menuitem" data-more-action="theme">主题设置</button>
            <button type="button" role="menuitem" data-more-action="clear-assignment">清除当前作业</button>
            <button type="button" role="menuitem" data-more-action="font-size">姓名字号</button>
            <button type="button" role="menuitem" data-more-action="seat-edit" aria-pressed="false">编辑座位表</button>
            <button type="button" role="menuitem" data-more-action="seat-reset">复位座位视图</button>
          </div>
        </div>
      </section>
      <section class="confirm-sheet" id="confirmSheet" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmMessage" aria-hidden="true" inert>
        <div class="confirm-panel sheet-panel sheet-panel--bottom">
          <div class="sheet-title"><span>请确认</span><h2 id="confirmTitle">确认操作</h2></div>
          <p id="confirmMessage"></p>
          <div class="confirm-actions">
            <button type="button" id="cancelConfirm">取消</button>
            <button type="button" id="acceptConfirm">确认</button>
          </div>
        </div>
      </section>
      <div class="scrim" id="scrim"></div>
      <aside class="menu-drawer" id="menuDrawer" aria-hidden="true" inert>
        <div class="menu-drawer-handle-zone" id="menuDrawerHandle">
          <div class="sheet-handle"></div>
        </div>
        <div class="menu-drawer-head sheet-head">
          <div class="menu-drawer-title sheet-title"><span>通用菜单</span><h2>登记工具</h2></div>
          <button class="sheet-close" id="closeMenuDrawer" aria-label="关闭菜单">×</button>
        </div>
        <section class="menu-drawer-section" aria-labelledby="drawerViewTitle">
          <h3 id="drawerViewTitle">登记视图</h3>
          <div class="menu-drawer-action-list">
            <button class="menu-item" data-action="view-grid"><span class="menu-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1" /><rect x="14" y="4" width="6" height="6" rx="1" /><rect x="4" y="14" width="6" height="6" rx="1" /><rect x="14" y="14" width="6" height="6" rx="1" /></svg></span><span class="menu-copy"><b>学生网格</b><small>查看全班提交状态</small></span><span class="menu-chevron" aria-hidden="true">›</span></button>
            <button class="menu-item" data-action="view-seats"><span class="menu-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h5v5H5zM14 6h5v5h-5zM5 15h5v4H5zM14 15h5v4h-5z" /><path d="M3 12h18" /></svg></span><span class="menu-copy"><b>座位表</b><small>按座位查看与登记</small></span><span class="menu-chevron" aria-hidden="true">›</span></button>
          </div>
        </section>
        <section class="menu-drawer-section" aria-labelledby="drawerActionTitle">
          <h3 id="drawerActionTitle">当前作业</h3>
          <div class="menu-drawer-action-list">
            <button class="menu-item" data-action="mark-all"><span class="menu-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" /><path d="m8.5 12 2.2 2.2 4.8-5" /></svg></span><span class="menu-copy"><b>全部标记已交</b><small>为所有学生添加提交状态</small></span><span class="menu-chevron" aria-hidden="true">›</span></button>
            <button class="menu-item" data-action="clear-all"><span class="menu-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5" /></svg></span><span class="menu-copy"><b>清除全部标记</b><small>同时清除当前作业分数</small></span><span class="menu-chevron" aria-hidden="true">›</span></button>
            <button class="menu-item" data-action="copy-missing"><span class="menu-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="7" width="11" height="13" rx="2" /><path d="M16 7V5a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h2" /></svg></span><span class="menu-copy"><b>复制未交名单</b><small>复制到系统剪贴板</small></span><span class="menu-chevron" aria-hidden="true">›</span></button>
            <button class="menu-item" data-action="reset-roster"><span class="menu-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.7L4 8.5M4 4v4.5h4.5" /></svg></span><span class="menu-copy"><b>恢复默认名单</b><small>重置名单、座位与登记记录</small></span><span class="menu-chevron" aria-hidden="true">›</span></button>
          </div>
        </section>
        <div class="menu-drawer-foot" id="menuDrawerBuild" aria-label="版本指纹">版本 —</div>
      </aside>
      <div class="toast" id="toast" role="status"></div>
    </main>
    <script type="module" src="./scripts/main.js"></script>
  </body>
</html>
